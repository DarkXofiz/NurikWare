// build.gradle, Gradle 8.14.2, Fabric Loom 1.13.3, Minecraft 1.21.11, Java 21
plugins {
    // MC 1.21.11 unpick V3 formati kullaniyor, bunu sadece Loom 1.13+ destekliyor
    // (1.9/1.10'da "UnsupportedOperationException: Unsupported unpick version" patlar).
    // 1.21.11 ayni zamanda Loom'un "obfuscated" olarak isaretledigi SON surum -
    // bu yuzden hala legacy "fabric-loom" plugin id'si gecerli (yeni surumler
    // non-obfuscated MC icin "net.fabricmc.fabric-loom" / "fabric-loom-remap" ayrimina gidiyor,
    // 1.21.11 o ayrimdan once kaliyor).
    id "fabric-loom" version "1.13.3"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Kutuphaneler orijinal jar'dan cikarilan libs/ klasorunden gelir (olu maven adresleri yok).
    compileOnly fileTree(dir: "libs", include: ["*.jar"])

    // Maven Central'da guvenilir olanlar
    implementation "com.github.oshi:oshi-core:6.6.5"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Sodium/Iris/Lithium kullanicinin kendi modlariyla cakismasin diye jar'a gomulmez.
def bundleLibs = fileTree(dir: "libs", include: ["*.jar"],
        exclude: ["net_caffeinemc*", "net_irisshaders*"])

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ bundleLibs.collect { zipTree(it) } }) {
        exclude "fabric.mod.json", "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA", "module-info.class"
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
