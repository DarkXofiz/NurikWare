name: Repack (NurikWare.jar)

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jar'i NurikWare adiyla yeniden paketle
        run: python3 tools/repack.py original/NurikWare.jar NurikWare.jar
      - uses: actions/upload-artifact@v4
        with:
          name: nurikware-jar
          path: NurikWare.jar
