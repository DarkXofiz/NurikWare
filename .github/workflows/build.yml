name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/repack.py"
      - "original/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NurikWare.jar uret (isim degistirme, derleme gerekmez)
        run: |
          set -e
          python3 tools/repack.py original/NurikWare.jar NurikWare.jar
          ls -la NurikWare.jar
          python3 -c "import zipfile;z=zipfile.ZipFile('NurikWare.jar');assert z.testzip() is None;print('jar gecerli,',len(z.namelist()),'giris')"
      - uses: actions/upload-artifact@v4
        with:
          name: nurikware-jar
          path: NurikWare.jar
